# SPDX-License-Identifier: GPL-3.0-or-later
name: ci

# No path filter: biometric data can arrive in any directory (the privacy job).
on:
  pull_request: {}
  push:
    branches: [main]

permissions: {}

defaults:
  run:
    shell: bash

# Runs on main always finish, so that each one saves the Rust cache.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: fmt, clippy, test, deny
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
    steps:
      - name: Tools for checkout, the cache and the tests
        # dbus-daemon: the D-Bus tests' private buses; glib2-devel: apex-session-agent links GIO,
        # and its test compiles the Apex schema.
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          git-core tar gzip zstd xz findutils curl python3 dbus-daemon diffutils glib2-devel
          pkgconf-pkg-config util-linux-core

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: apex-linux/apex-ci/actions/fedora-rust@6e5d6c625ccb44ba31d1ca97a2a94a27205940a1 # main

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"
          # A pull request must not seed the cache that main uses.
          save-if: ${{ github.event_name == 'push' }}

      - uses: apex-linux/apex-ci/actions/install-tool@6e5d6c625ccb44ba31d1ca97a2a94a27205940a1 # main
        with:
          tools: cargo-deny

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        # The bus tests must run: apexctl's skip under APEXCTL_TEST_SKIP_BUS, apex-boot's without dbus-daemon.
        # The container runs as root: repair-grub's root tests fail rather than return without it.
        env:
          APEXCTL_TEST_REQUIRE_ROOT: "1"
        run: |
          unset APEXCTL_TEST_SKIP_BUS
          test -x /usr/bin/dbus-daemon || { echo "::error::/usr/bin/dbus-daemon is missing: the D-Bus tests would not run"; exit 1; }
          test -x /usr/bin/setpriv || { echo "::error::/usr/bin/setpriv is missing: repair-grub's refusal test would fail"; exit 1; }
          cargo test --workspace --locked

      - name: cargo deny
        run: cargo deny --locked check

      - name: RPM License tag matches the linked crates
        run: |
          python3 packaging/licenses.py --self-test
          python3 packaging/licenses.py --check packaging/apex.spec

  scripts:
    name: shellcheck, actionlint, selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: apex-linux/apex-ci/actions/install-tool@6e5d6c625ccb44ba31d1ca97a2a94a27205940a1 # main
        with:
          tools: actionlint shellcheck

      - name: actionlint
        run: actionlint -config-file .github/scripts/actionlint.yaml

      - name: bash -n and shellcheck
        run: |
          files=(.github/scripts/*.sh hardware/*/audio/*.sh)
          for f in "${files[@]}"; do bash -n "$f"; done
          shellcheck -x -P .github/scripts --severity=style "${files[@]}"

      - name: Script self-tests
        run: .github/scripts/selftest.sh

  privacy:
    name: No biometric files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: apex-linux/apex-ci/actions/privacy-guard@6e5d6c625ccb44ba31d1ca97a2a94a27205940a1 # main

  comments:
    name: Comment guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: apex-linux/apex-ci/actions/comments@6e5d6c625ccb44ba31d1ca97a2a94a27205940a1 # main
