# SPDX-License-Identifier: GPL-3.0-or-later
name: ci

# No path filter: biometric data can arrive in any directory (the privacy job).
on:
  pull_request: {}
  push:
    branches: [main]

permissions: {}

defaults:
  run:
    shell: bash

# Runs on main always finish, so that each one saves the Rust cache.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: fmt, clippy, test, deny
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
    steps:
      - name: Tools for checkout, the cache and the tests
        # dbus-daemon runs the D-Bus tests' private buses; git, tar and diffutils run for
        # real in apex-lane's tests/shell_fakes.rs.
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          git-core tar gzip zstd xz findutils curl python3 dbus-daemon diffutils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Fedora's Rust toolchain (the compose's repositories)
        run: .github/scripts/rpms.sh toolchain

      - name: Fedora rustc matches rust-toolchain.toml
        run: .github/scripts/rust-toolchain-check.sh

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"
          # A pull request must not seed the cache that main uses.
          save-if: ${{ github.event_name == 'push' }}

      - name: Install cargo-deny (pinned release, SHA-256 checked)
        run: |
          .github/scripts/install-tool.sh cargo-deny "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        # The private-bus tests must run, not skip: apexctl's skip under
        # APEXCTL_TEST_SKIP_BUS, apex-boot's without /usr/bin/dbus-daemon.
        run: |
          unset APEXCTL_TEST_SKIP_BUS
          test -x /usr/bin/dbus-daemon || { echo "::error::/usr/bin/dbus-daemon is missing: the D-Bus tests would not run"; exit 1; }
          cargo test --workspace --locked

      - name: cargo deny
        run: cargo deny --locked check

      - name: RPM License tag matches the linked crates
        run: |
          python3 packaging/licenses.py --self-test
          python3 packaging/licenses.py --check packaging/apex.spec

  scripts:
    name: shellcheck, actionlint, selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint and shellcheck (pinned releases, SHA-256 checked)
        run: |
          .github/scripts/install-tool.sh actionlint "$RUNNER_TEMP/bin"
          .github/scripts/install-tool.sh shellcheck "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: actionlint
        # With shellcheck on PATH, actionlint also checks every run: block.
        run: actionlint -config-file .github/scripts/actionlint.yaml

      - name: bash -n and shellcheck of the CI, packaging, builder VM and test scripts
        run: |
          for f in .github/scripts/*.sh packaging/*/build.sh packaging/pkgs/*/check.sh tools/builder-vm/*.sh tests/*/run.sh; do bash -n "$f"; done
          shellcheck -x -P .github/scripts --severity=style .github/scripts/*.sh
          shellcheck -x --severity=style packaging/*/build.sh packaging/pkgs/*/check.sh tools/builder-vm/*.sh tests/*/run.sh

      - name: sh -n, bash -n and shellcheck of image/checks and image/tests
        # The Containerfile's final stage runs image/checks with sh.
        run: |
          files=(image/checks/*.sh image/checks/lib/*.sh image/tests/*.sh image/tests/fake/createrepo_c)
          for f in "${files[@]}"; do sh -n "$f"; bash -n "$f"; done
          shellcheck -x -P SCRIPTDIR -s sh --severity=style "${files[@]}"

      - name: Script self-tests
        run: .github/scripts/selftest.sh

      - name: renovate.json is valid JSON
        run: jq empty renovate.json

  image-tests:
    name: image/tests/run.sh (Fedora 45)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
      # bubblewrap in t-repos.sh needs mount namespaces. The hosted runner is disposable
      # and this job holds no secrets.
      options: --privileged
    env:
      APEX_IMAGE_TESTS_NO_SKIP: "1"
    steps:
      - name: Tools of the checks and their tests
        # dash: run.sh runs every file with sh and with dash.
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          git-core python3 bubblewrap dash bash coreutils diffutils findutils gawk grep sed
          systemd systemd-udev openssl glib2 gnupg2

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python fakes compile
        run: |
          for f in image/tests/fake/*; do
            if head -n 1 "$f" | grep -q python3; then
              python3 -c 'import ast, sys; ast.parse(open(sys.argv[1]).read(), sys.argv[1])' "$f"
            fi
          done

      - name: image/tests/run.sh
        # Without safe.directory, git refuses the runner-owned checkout to root, and
        # t-lists.sh silently leaves out its .gitignore checks.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --git-dir >/dev/null
          image/tests/run.sh

  layer-tests:
    name: tests/layer/run.sh (Fedora 45)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
      # bubblewrap binds a fixture over /proc/cmdline, which needs mount namespaces. The
      # hosted runner is disposable and this job holds no secrets.
      options: --privileged
    env:
      APEX_LAYER_TESTS_NO_SKIP: "1"
    steps:
      - name: gjs, glib2 and bubblewrap
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          gjs glib2 bubblewrap bash coreutils grep sed

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: tests/layer/run.sh
        run: tests/layer/run.sh

  privacy:
    name: No biometric files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tracked files
        run: .github/scripts/privacy-guard.sh
