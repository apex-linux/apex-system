# Reboots a boot of an update on trial that GRUB counted and that stopped in emergency or
# rescue mode, so the counted rollback still happens. Installed identically for
# emergency.service and rescue.service.
# Add nothing else here: a condition would skip the shell, an empty ExecStartPre= would drop
# its plymouth line, and "-" keeps any exit status from failing the shell.

[Service]
ExecStartPre=-/usr/libexec/apex/apex-boot-assess --emergency-watchdog
