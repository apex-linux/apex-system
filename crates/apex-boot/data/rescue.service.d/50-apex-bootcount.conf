# 50-apex-bootcount.conf: the early-boot watchdog of the Apex boot counter (ADR 0009,
# Consequences; crate apex-boot, module emergency).
#
# Installed twice, byte for byte the same (a test keeps the two copies identical):
#   /usr/lib/systemd/system/emergency.service.d/50-apex-bootcount.conf
#   /usr/lib/systemd/system/rescue.service.d/50-apex-bootcount.conf
#
# Why: apex-boot-assess.service judges a boot only after graphical.target. A boot of an
# update on trial that stops earlier in emergency or rescue mode (for example after a
# failed local-fs.target dependency) waits at sulogin, and GRUB's counter would move only
# when someone forces a power-off. This drop-in makes such a boot reboot by itself, after
# a delay announced on the console, so the counted rollback still happens.
#
# What runs: before the shell starts (after the unit's own "plymouth --wait quit", so the
# console shows text), `apex-boot-assess --emergency-watchdog`:
#   - reads /boot/grub2/grubenv with head(1), a child process it kills after 5 s;
#   - only when apex_target is set, apex_ok is not 1 and apex_counter is 2, 1 or 0 (GRUB
#     counted this boot), schedules `systemctl reboot` in 60 s with
#       systemd-run --unit=apex-emergency-reboot --on-active=60s ... /usr/bin/systemctl reboot
#     and prints that on the console together with how to cancel it:
#       systemctl stop apex-emergency-reboot.timer
#     The transient units have DefaultDependencies=no (they must not pull in the
#     sysinit.target that just failed), and the reboot runs only if emergency.service or
#     rescue.service is still active when the timer fires (ExecCondition=): leaving the
#     shell to continue the boot drops the reboot.
#   - in every other case it prints nothing and does nothing: an ordinary emergency or
#     rescue shell stays exactly as it was. When grubenv cannot be read (for example /boot
#     is the mount that failed) it prints one line and does not reboot.
# Each reboot happens only on a boot GRUB counted, so at most three follow one update
# before GRUB falls back to the previous deployment (apex_counter=-1), after which the
# watchdog stays quiet.
#
# Never blocks or fails the shell: the "-" prefix ignores any exit status (a missing
# binary included), and the command finishes within
# apex_boot::emergency::WATCHDOG_TIME_BUDGET (35 s), well inside the 90 s start timeout
# the shell units inherit from DefaultTimeoutStartSec=. Deliberately nothing else is set
# here: no [Unit] condition (it would skip the shell itself), no empty ExecStartPre= (it
# would drop the plymouth line), no change of Type=, timeouts or the terminal settings.
#
# The initramfs: dracut installs its own emergency.service and rescue.service and no
# drop-in directories from /usr/lib, so this applies to the real root only. There,
# panic=10 rd.shell=0 rd.emergency=reboot (image kargs) already reboot. Should a copy
# ever reach an initramfs, the binary is missing there (ignored by "-") and it does
# nothing when /etc/initrd-release exists.
#
# To turn it off on one machine, mask this file with a /dev/null symlink of the same name
# in /etc/systemd/system/emergency.service.d/ and /etc/systemd/system/rescue.service.d/.

[Service]
ExecStartPre=-/usr/libexec/apex/apex-boot-assess --emergency-watchdog
