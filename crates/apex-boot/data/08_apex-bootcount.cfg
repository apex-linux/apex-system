# apex-bootcount v1
#
# The line above is the marker apex-boot-assess looks for. Bump its version with
# snippet::MARKER_VERSION when the behaviour below changes after it has shipped: machines
# keep the copy they got at `bootc install` until it is reinstalled.
# It runs before 10_blscfg.cfg; GRUB reads `default` only when the menu starts.
# fallback=1 makes GRUB boot entry 1 at once if it cannot load the new kernel or
# initramfs; it is a runtime variable and is not saved.
# GRUB script has no arithmetic, and the `increment` module may not be built into the
# signed grubx64.efi, so every counted value is spelled out.

if [ -n "${apex_target}" ]; then
  if [ -n "${apex_counter}" ]; then
    if [ "${apex_ok}" != "1" ]; then
      if [ "${apex_counter}" = "3" ]; then
        set apex_counter=2
        set fallback=1
      elif [ "${apex_counter}" = "2" ]; then
        set apex_counter=1
        set fallback=1
      elif [ "${apex_counter}" = "1" ]; then
        set apex_counter=0
        set fallback=1
      else
        set default=1
        set apex_counter=-1
      fi
      # save_env writes grubenv in place through its disk block list, which needs the plain
      # ext4 /boot. If it fails the counter stays, and apex-boot-assess never reboots.
      save_env apex_counter
    fi
  fi
fi

set apex_ok=0
save_env apex_ok
