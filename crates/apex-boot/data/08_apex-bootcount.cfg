# apex-bootcount v1
#
# Apex boot counting (ADR 0009). The line above is the marker apex-boot-assess looks for
# in /boot/grub2/grub.cfg (crate apex-boot, snippet::MARKER). Bump its version together
# with snippet::MARKER_VERSION whenever the behaviour below changes after it has shipped
# in an image. Installed machines keep the copy they got at install time until it is
# reinstalled, so an image must keep working with every version from
# snippet::MIN_COMPATIBLE_VERSION on; an older compatible copy is only reported. Raise
# MIN_COMPATIBLE_VERSION only when that is impossible: the new image then fails its
# required grub-cfg-marker check, and is rolled back, on every machine with an older copy.
#
# Installed as /usr/lib/bootupd/grub2-static/configs.d/08_apex-bootcount.cfg. bootupd
# builds /boot/grub2/grub.cfg from grub-static-pre.cfg plus every configs.d/*.cfg in
# file-name order, each wrapped in "### BEGIN <name> ###" / "### END <name> ###". It does
# this only at `bootc install`; later changes to this file reach /boot only by
# reinstalling the static config (apexctl boot repair-grub, M2).
#
# Where this runs:
#   grub-static-pre.cfg   load_env reads /boot/grub2/grubenv, so apex_target, apex_counter
#                         and apex_ok are GRUB variables here. It sets timeout=1 and
#                         leaves `default` unset, i.e. entry 0.
#   01_users.cfg
#   08_apex-bootcount.cfg this file; it may set default=1 or fallback=1
#   10_blscfg.cfg         one menu entry per ostree deployment: entry 0 is the default
#                         deployment, entry 1 the previous (rollback) deployment
#   14_menu_show_once.cfg, 30_uefi-firmware.cfg, 41_custom.cfg
# GRUB reads `default` only when the menu starts, after the whole file ran, so setting it
# before blscfg creates the entries works. greenboot-rs's 08_greenboot.cfg relies on the
# same ordering.
#
# Variables (docs/specs/M1-IMPLEMENTATION.md, section 5). The names are Apex's own:
# Fedora's grub2-set-bootflag and grub-boot-success.timer set boot_success=1 after a
# login, and greenboot uses boot_counter; sharing either would let a login mark a failed
# armed boot as good.
#   apex_target   digest of the deployment being tried. apex-updated sets it on Apply.
#   apex_counter  attempts left. Apply sets 3.
#   apex_ok       apex-boot-assess sets 1 when the boot is green.
# Apply writes all three in one grub2-editenv call: apex_target=<digest> apex_counter=3
# apex_ok=0.
#
# What happens at each boot:
#   The counter is armed when apex_target and apex_counter are both non-empty. Checking
#   apex_target as well as apex_counter means a counter nobody armed never moves the
#   default entry.
#   An armed boot that userspace has not confirmed (apex_ok is not 1):
#     3 -> 2, 2 -> 1, 1 -> 0, set fallback=1, then boot the default entry, which is the
#     new deployment. fallback=1 makes GRUB boot entry 1 at once if it cannot load the
#     new kernel or initramfs (for example a signature failure), instead of stopping.
#     fallback is a runtime variable and is not saved;
#     0 or any other value -> boot entry 1, the previous deployment, and store -1.
#   So the new deployment gets exactly three boots. Userspace reads 2, 1 and 0 during them,
#   and -1 once GRUB has fallen back ("counter exhausted"). -1 stays, and every following
#   boot keeps choosing entry 1, until apex-boot-assess acts on the fallback: it first
#   stores 3 (counted boots of whatever entry 0 is, as after Apply), then has the previous
#   deployment made the default (bootc rollback, run by apex-updated, which swaps entries
#   0 and 1), then clears the variables. If that sequence is cut short, the next boot is a
#   counted boot of entry 0, never of an entry 1 that may by then be the failed target.
#   Every boot, armed or not, then sets apex_ok=0, so each boot must be confirmed again.
#   Entry 1 is always a deployment when the target boots: Apply arms only when the booted
#   deployment comes from an image and a different image is staged, and finalization
#   makes the staged deployment entry 0 and keeps the booted one as entry 1.
#
# GRUB script has no arithmetic. greenboot-rs 0.16.4 decrements with the `decrement`
# command from Fedora's `increment` module. The explicit comparisons below do not depend
# on that module being built into the signed grubx64.efi, and they spell out every value
# that is counted down; anything else falls back.
#
# save_env writes grubenv in place through its disk block list. That works on the plain
# ext4 /boot that ADR 0010 requires, but not on btrfs or an encrypted /boot. If the write
# fails, the counter does not move: apex-boot-assess then sees an uncounted boot and never
# reboots on its own.
#
# Recovery by hand: pick the second menu entry to boot the previous deployment, or disarm
# with `grub2-editenv /boot/grub2/grubenv unset apex_target apex_counter` (on a bootc
# system /boot is read-only: run it inside `unshare --mount` after
# `mount -o remount,rw /boot`).

if [ -n "${apex_target}" ]; then
  if [ -n "${apex_counter}" ]; then
    if [ "${apex_ok}" != "1" ]; then
      if [ "${apex_counter}" = "3" ]; then
        set apex_counter=2
        set fallback=1
      elif [ "${apex_counter}" = "2" ]; then
        set apex_counter=1
        set fallback=1
      elif [ "${apex_counter}" = "1" ]; then
        set apex_counter=0
        set fallback=1
      else
        # No attempts left (0), or GRUB fell back already (-1), or a value Apex never
        # writes: boot the previous deployment.
        set default=1
        set apex_counter=-1
      fi
      save_env apex_counter
    fi
  fi
fi

# Userspace has to confirm this boot again.
set apex_ok=0
save_env apex_ok
