[package]
name = "apex-boot"
description = "Apex boot assessment (ADR 0009): GRUB environment block codec, boot counter arming, the pure decision table, a check runner with timeouts, and the early-boot watchdog for emergency and rescue shells"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "apex_boot"

[[bin]]
name = "apex-boot-assess"
path = "src/bin/apex-boot-assess/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Reads the built-in hardware profile.
toml.workspace = true
# Used only by the apex-boot-assess binary; the library needs none of them.
anyhow.workspace = true
apex-bootc.workspace = true
apex-dbus.workspace = true
clap.workspace = true
nix = { workspace = true, features = ["time"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Direct dependency because the zbus proxy macro resolves the `zbus` crate by name.
zbus.workspace = true

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
