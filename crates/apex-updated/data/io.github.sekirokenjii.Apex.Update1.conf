<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System bus policy of the Apex update service. Installed in /usr/share/dbus-1/system.d/.

  Only root may own the name. Everyone may call the update interface, read its
  properties (Get, GetAll), introspect it and ping it; the daemon itself authorizes every
  method (polkit, or uid 0 for Automatic and ReportBoot). Properties.Set is not allowed
  here even though the interface has no writable property, so no caller can reach the
  object server's write path at all. Nothing else is allowed.
-->
<busconfig>
  <policy user="root">
    <allow own="io.github.sekirokenjii.Apex.Update1"/>
  </policy>

  <policy context="default">
    <allow send_destination="io.github.sekirokenjii.Apex.Update1"
           send_interface="io.github.sekirokenjii.Apex.Update1"/>
    <allow send_destination="io.github.sekirokenjii.Apex.Update1"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
    <allow send_destination="io.github.sekirokenjii.Apex.Update1"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="GetAll"/>
    <allow send_destination="io.github.sekirokenjii.Apex.Update1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.sekirokenjii.Apex.Update1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
