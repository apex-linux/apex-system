<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The daemon authorizes every method itself. Properties.Set stays denied although no
     property is writable, so no caller reaches the object server's write path. -->
<busconfig>
  <policy user="root">
    <allow own="io.github.apex_linux.Apex.Update1"/>
  </policy>

  <policy context="default">
    <allow send_destination="io.github.apex_linux.Apex.Update1"
           send_interface="io.github.apex_linux.Apex.Update1"/>
    <allow send_destination="io.github.apex_linux.Apex.Update1"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
    <allow send_destination="io.github.apex_linux.Apex.Update1"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="GetAll"/>
    <allow send_destination="io.github.apex_linux.Apex.Update1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.apex_linux.Apex.Update1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
