[package]
name = "apexctl"
description = "The Apex command-line tool: update control through apex-updated, read-only hardware reports, hardware-profile rendering and image build helpers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "apexctl"
path = "src/lib.rs"

[[bin]]
name = "apexctl"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
apex-bootc.workspace = true
apex-dbus.workspace = true
apex-update.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
# The version insta already pulls in; 3.x would add a second copy (deny.toml warns).
similar = "2.7.0"
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
