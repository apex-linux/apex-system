# apex-bootcount v1
# Bump the marker with snippet::MARKER_VERSION on any change in behaviour: installs keep their copy.

if [ -n "${apex_target}" ]; then
  if [ -n "${apex_counter}" ]; then
    if [ "${apex_ok}" != "1" ]; then
      # GRUB script has no arithmetic, and the signed grubx64.efi may lack the `increment`
      # module, so every counted value is spelled out.
      if [ "${apex_counter}" = "3" ]; then
        set apex_counter=2
        set fallback=1
      elif [ "${apex_counter}" = "2" ]; then
        set apex_counter=1
        set fallback=1
      elif [ "${apex_counter}" = "1" ]; then
        set apex_counter=0
        set fallback=1
      else
        # GRUB reads `default` only when its menu starts, after 10_blscfg.cfg made the entries.
        set default=1
        set apex_counter=-1
      fi
      # save_env writes grubenv in place through its disk block list, which needs the plain
      # ext4 /boot. If it fails the counter stays, and apex-boot-assess never reboots.
      save_env apex_counter
    fi
  fi
fi

set apex_ok=0
save_env apex_ok
