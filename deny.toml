# cargo-deny policy: advisories, licenses, bans, sources. Run: cargo deny check
[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "LGPL-2.1-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # One async runtime in daemons: tokio. async-std is unmaintained.
    { crate = "async-std" },
    # GUI code must stay on the GLib main loop; relm4 forces tokio into the UI (ADR 0002).
    { crate = "relm4" },
    # OpenSSL is not needed anywhere; image signatures are enforced by containers-policy.json.
    { crate = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
